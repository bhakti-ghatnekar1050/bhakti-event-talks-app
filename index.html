<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talks Event</title>
    <style>:root {
        --primary-color: #4A90E2; /* Blue */
        --secondary-color: #50E3C2; /* Green-ish */
        --accent-color: #F5A623; /* Orange */
        --text-color: #333;
        --light-text-color: #666;
        --background-color: #F8F9FA;
        --card-background: #FFFFFF;
        --border-color: #E0E0E0;
        --shadow-color: rgba(0, 0, 0, 0.08);
    }

    /* Basic Reset & Body Styling */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.6;
        color: var(--text-color);
        background-color: var(--background-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Header */
    .event-header {
        background-color: var(--primary-color);
        color: #FFFFFF;
        padding: 3rem 1rem;
        text-align: center;
        box-shadow: 0 4px 10px var(--shadow-color);
    }

    .event-header h1 {
        font-size: 2.8rem;
        margin-bottom: 0.5rem;
        letter-spacing: 1px;
    }

    .event-header p {
        font-size: 1.2rem;
        opacity: 0.9;
    }

    /* Main Content Container */
    .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
        flex-grow: 1;
    }

    /* Filter Section */
    .filters-section {
        background-color: var(--card-background);
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px var(--shadow-color);
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .filters-section label {
        font-weight: bold;
        color: var(--light-text-color);
        font-size: 1.1rem;
    }

    .filters-section select {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 5px;
        font-size: 1rem;
        background-color: #FFFFFF;
        cursor: pointer;
        outline: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .filters-section select:hover {
        border-color: var(--primary-color);
    }

    .filters-section select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    /* Schedule Section */
    .schedule-section h2 {
        font-size: 2rem;
        color: var(--primary-color);
        text-align: center;
        margin-bottom: 1.5rem;
        border-bottom: 2px solid var(--secondary-color);
        padding-bottom: 0.5rem;
        display: inline-block;
        width: 100%;
    }

    .schedule-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
    }

    /* Talk Card Styling */
    .talk-card, .break-card {
        background-color: var(--card-background);
        border-radius: 8px;
        box-shadow: 0 2px 8px var(--shadow-color);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .talk-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 16px var(--shadow-color);
    }

    .talk-card.hidden {
        display: none;
    }

    .talk-card .time, .break-card .time {
        font-size: 0.9rem;
        color: var(--primary-color);
        font-weight: bold;
        margin-bottom: 0.5rem;
        border-bottom: 1px dashed var(--border-color);
        padding-bottom: 0.5rem;
    }

    .talk-card h3 {
        font-size: 1.4rem;
        color: var(--text-color);
        margin-bottom: 0.75rem;
    }

    .talk-card .speakers {
        font-size: 1rem;
        color: var(--light-text-color);
        margin-bottom: 0.5rem;
    }

    .talk-card .categories {
        font-size: 0.85rem;
        color: var(--primary-color);
        margin-bottom: 1rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
    }
    .talk-card .category-tag {
        background-color: var(--primary-color);
        color: white;
        padding: 0.2em 0.6em;
        border-radius: 4px;
        font-size: 0.8em;
    }

    .talk-card .description {
        font-size: 0.95rem;
        color: var(--light-text-color);
        flex-grow: 1; /* Allows description to take available space */
    }

    /* Break Card Styling */
    .break-card {
        background-color: #E6F7FF; /* Lighter blue for breaks */
        border: 1px dashed var(--primary-color);
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .break-card h3 {
        color: var(--primary-color);
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }

    .break-card .duration {
        font-size: 1rem;
        color: var(--light-text-color);
    }

    /* Footer */
    .event-footer {
        background-color: var(--text-color);
        color: #FFFFFF;
        text-align: center;
        padding: 1.5rem 1rem;
        margin-top: 3rem;
        font-size: 0.9rem;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .event-header h1 {
            font-size: 2.2rem;
        }

        .event-header p {
            font-size: 1rem;
        }

        .schedule-grid {
            grid-template-columns: 1fr;
        }

        .filters-section {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
        }
    }
</style>
</head>
